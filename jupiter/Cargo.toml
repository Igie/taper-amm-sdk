# A fourth cargo workspace, for the same reason `tests/` and `localnet/` are
# separate: `jupiter-amm-interface` drags in the Agave host tree, and that must
# stay out of the SBF graph the program is compiled in.
[workspace]
resolver = "2"
members = ["taper-amm-sdk", "taper-jupiter"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
taper-core = { path = "../crates/taper-core" }

# D2, decided here so there is one line to change.
#
# `0.6.1` (Jan 2026) is the plan's default and what this builds against.
# `1.0.0-beta.0` (Apr 2026) also builds, and needs no `solana-account-decoder`
# pin - see the note beside that pin below. Neither choice reaches
# `taper-core`, which depends on `bytemuck` and nothing else either way.
jupiter-amm-interface = "0.6.1"

# Not used by any of our code, and here only to steer resolution.
# `jupiter-amm-interface` 0.6.1 calls `UiAccount::decode`, which
# `solana-account-decoder` 4.x removed; the interface asks for `>= 2`, so a
# fresh resolve hands it 4.x and the interface itself fails to compile. Naming
# an older major here keeps the graph off 4.x - the interface then links
# 3.1.14, which still has the method. `1.0.0-beta.0` needs none of this.
solana-account-decoder = "~2"
