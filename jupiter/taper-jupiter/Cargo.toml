[package]
name = "taper-jupiter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "jupiter_amm_interface::Amm for taper-amm"

[features]
default = []
# Uses `Swap::Taper { swap_for_y }`, which the published
# `jupiter-amm-interface` does not have. Build with this only against a
# patched one; see `taper_swap` for why it is not the default.
pending-swap-variant = []

[dependencies]
taper-amm-sdk = { path = "../taper-amm-sdk" }
jupiter-amm-interface.workspace = true
solana-account-decoder.workspace = true
anyhow = "1"
rust_decimal = "1.36"
solana-pubkey = ">=2"

[dev-dependencies]
# The parity fixtures are JSON snapshots. Test-only: none of this reaches a
# consumer of the crate.
serde_json = "1"
# Pinned to the major `jupiter-amm-interface` links, or `AccountMap` would
# want a different `Account` type than the one built here.
solana-account = "3"
